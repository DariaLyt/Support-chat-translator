name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: translator
          POSTGRES_PASSWORD: translator
          POSTGRES_DB: translator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U translator -d translator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://translator:translator@localhost:5432/translator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ".[dev]"
      - name: Test
        run: pytest
