[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-chat-translator"
version = "0.1.0"
description = "Translates courier and customer support messages, and scores each model on meaning, latency, and cost."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.0",
  "pytest>=8.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
